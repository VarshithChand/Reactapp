services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: eduvault_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 150711
      POSTGRES_DB: myapp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eduvault_backend
    environment:
      DATABASE_URL: postgresql://postgres:150711@db:5432/myapp
      FLASK_ENV: production
      FLASK_APP: app.py
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: python app.py
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: eduvault_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://backend:5000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
